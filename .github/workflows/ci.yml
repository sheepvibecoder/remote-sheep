# The gate a release candidate passes on its way from develop to main: format,
# lint, types, tests with coverage thresholds, the build, and the committed agent
# bundle matching that build. It runs only on `testing`; day-to-day work on
# develop is checked locally by `pnpm check` and the git hooks. Keep the job
# named `check`; branch protection targets it.

name: CI

on:
  pull_request:
    branches: [testing]
  push:
    branches: [testing]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: format:check
        run: pnpm format:check

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test:coverage

      - name: build
        run: pnpm build

      # The Herdr plugin runs the committed packages/agent/dist with no build step: fail when it
      # differs from the build above, so a release never ships a stale bundle.
      - name: bundle is up to date
        run: node scripts/check-bundle.mjs --no-build
