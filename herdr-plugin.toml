id = "sheepvibecoder.remote-sheep"
name = "remote-sheep"
version = "0.9.0"
min_herdr_version = "0.9.5"
description = "Drive the coding agents running in Herdr from your phone, by chat and voice"
platforms = ["linux", "macos", "windows"]

# Needs Node 22+ and pnpm on PATH. On Windows Herdr finds pnpm.cmd through PATHEXT.
[[build]]
command = ["pnpm", "install", "--frozen-lockfile"]

[[build]]
command = ["pnpm", "build"]

# Every command is the same Node loader: Herdr runs it with no shell and, on Windows, in a
# \\?\C:\... folder where `node <relative path>` fails. The loader strips that prefix from
# HERDR_PLUGIN_ROOT, moves there and imports herdr-plugin/plugin.mjs, which runs the built
# agent's `start`, `stop`, `status`, `qr` or `relay change`. One command for all platforms keeps
# the action ids the same everywhere (ids must be unique inside a plugin).

# One-shot per Herdr start: starts the agent in the background unless it already runs.
[[startup]]
command = ["node", "-e", 'const r = (process.env.HERDR_PLUGIN_ROOT || process.cwd()).replace(/^\\\\\?\\/, ""); process.chdir(r); import(require("url").pathToFileURL(require("path").join(r, "herdr-plugin", "plugin.mjs")).href)', "start"]

[[actions]]
id = "start"
title = "Start remote-sheep"
contexts = ["workspace"]
command = ["node", "-e", 'const r = (process.env.HERDR_PLUGIN_ROOT || process.cwd()).replace(/^\\\\\?\\/, ""); process.chdir(r); import(require("url").pathToFileURL(require("path").join(r, "herdr-plugin", "plugin.mjs")).href)', "start"]

[[actions]]
id = "stop"
title = "Stop remote-sheep"
contexts = ["workspace"]
command = ["node", "-e", 'const r = (process.env.HERDR_PLUGIN_ROOT || process.cwd()).replace(/^\\\\\?\\/, ""); process.chdir(r); import(require("url").pathToFileURL(require("path").join(r, "herdr-plugin", "plugin.mjs")).href)', "stop"]

# Stops the running agent and starts it again from this installation, with the same data, port
# and relay. After the app's Settings → Update, the agent asks Herdr to run this action: Herdr
# runs it from the newly built installation, so the new version is the one that starts.
[[actions]]
id = "restart"
title = "Restart remote-sheep"
contexts = ["workspace"]
command = ["node", "-e", 'const r = (process.env.HERDR_PLUGIN_ROOT || process.cwd()).replace(/^\\\\\?\\/, ""); process.chdir(r); import(require("url").pathToFileURL(require("path").join(r, "herdr-plugin", "plugin.mjs")).href)', "restart"]

[[actions]]
id = "status"
title = "remote-sheep status"
contexts = ["workspace"]
command = ["node", "-e", 'const r = (process.env.HERDR_PLUGIN_ROOT || process.cwd()).replace(/^\\\\\?\\/, ""); process.chdir(r); import(require("url").pathToFileURL(require("path").join(r, "herdr-plugin", "plugin.mjs")).href)', "status"]

# Pairing: the action opens the `qr` pane, which asks the running agent for a new QR code and
# links (one for a browser on this PC, at 127.0.0.1) and waits: Enter shows a new one, q or Esc
# closes the pane. Closing it never stops the agent; only `stop` does.
[[actions]]
id = "qr"
title = "Show pairing QR"
contexts = ["workspace"]
command = ["node", "-e", 'const r = (process.env.HERDR_PLUGIN_ROOT || process.cwd()).replace(/^\\\\\?\\/, ""); process.chdir(r); import(require("url").pathToFileURL(require("path").join(r, "herdr-plugin", "plugin.mjs")).href)', "open-qr"]

# No placement: the default overlay is a temporary zoomed pane that gives the QR code the whole
# screen and restores the previous focus and zoom when it closes. A popup is half the screen by
# default and may be newer than the oldest Herdr this plugin accepts.
[[panes]]
id = "qr"
title = "remote-sheep pairing QR"
command = ["node", "-e", 'const r = (process.env.HERDR_PLUGIN_ROOT || process.cwd()).replace(/^\\\\\?\\/, ""); process.chdir(r); import(require("url").pathToFileURL(require("path").join(r, "herdr-plugin", "plugin.mjs")).href)', "qr"]

# Relay: the action opens the `relay` pane, which shows the running agent's relay and asks for a
# new URL and access code (the code is not shown as it is typed), or an empty URL to turn the relay
# off. The agent connects at once, with no restart, and keeps the setting in relay.json for the
# next start. Phones can do the same in the app, under Settings.
[[actions]]
id = "relay"
title = "Set the relay"
contexts = ["workspace"]
command = ["node", "-e", 'const r = (process.env.HERDR_PLUGIN_ROOT || process.cwd()).replace(/^\\\\\?\\/, ""); process.chdir(r); import(require("url").pathToFileURL(require("path").join(r, "herdr-plugin", "plugin.mjs")).href)', "open-relay"]

[[panes]]
id = "relay"
title = "remote-sheep relay"
command = ["node", "-e", 'const r = (process.env.HERDR_PLUGIN_ROOT || process.cwd()).replace(/^\\\\\?\\/, ""); process.chdir(r); import(require("url").pathToFileURL(require("path").join(r, "herdr-plugin", "plugin.mjs")).href)', "relay"]
